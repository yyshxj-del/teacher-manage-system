<body class="min-h-screen flex flex-col">

      // =========================================================================

      const state = {
        tab: 'overview',
        selectedClass: 'all',
        search: '',
        checkedTasks: {} // 仅在学生自己浏览器记录作业自查勾选，不影响他人
      };

      try {
        const saved = localStorage.getItem('ccucm_student_checks_v1');
        if (saved) state.checkedTasks = JSON.parse(saved);
      } catch (e) {}

      function saveChecks() {
        try {
          localStorage.setItem('ccucm_student_checks_v1', JSON.stringify(state.checkedTasks));
        } catch (e) {}
      }

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function matchClass(itemClasses) {
        if (state.selectedClass === 'all') return true;
        return Array.isArray(itemClasses) && itemClasses.includes(state.selectedClass);
      }

      function matchSearch(text) {
        const q = state.search.trim().toLowerCase();
        if (!q) return true;
        return String(text || '').toLowerCase().includes(q);
      }

      function formatClassBadge(classes) {
        if (!classes || classes.length === 4) return '1–4班全体';
        return classes.map(c => c.replace('中西医临床', '')).join('、');
      }

      function openDetail(title, htmlBody) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalContent').innerHTML = htmlBody;
        const m = document.getElementById('detailModal');
        m.classList.remove('hidden');
        m.classList.add('flex');
      }

      function closeDetail() {
        const m = document.getElementById('detailModal');
        m.classList.add('hidden');
        m.classList.remove('flex');
      }

      function renderScheduleCard(s) {
        const typeColor = s.type === '临床见习'
          ? 'bg-rose-50 text-rose-700 border-rose-200'
          : s.type === '病案讨论'
            ? 'bg-amber-50 text-amber-700 border-amber-200'
            : 'bg-indigo-50 text-indigo-700 border-indigo-200';
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-4 hover:border-indigo-200 transition">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-lg bg-slate-900 text-white">${esc(s.day)} ${esc(s.time)}</span>
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${typeColor}">${esc(s.type)}</span>
              </div>
              <span class="text-xs font-medium text-indigo-600">${esc(formatClassBadge(s.classes))}</span>
            </div>
            <h4 class="text-sm font-bold text-slate-900 mt-2.5">${esc(s.title)}</h4>
            <div class="text-xs text-slate-500 mt-1">地点：${esc(s.location)}</div>
            <div class="mt-2.5 p-2.5 rounded-xl bg-slate-50 text-xs text-slate-600 leading-relaxed">
              <span class="font-semibold text-slate-700">预习与携带提示：</span>${esc(s.prepTip)}
            </div>
          </div>
        `;
      }

      function renderHomeworkCard(hw) {
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h4 class="text-sm font-bold text-slate-900">${esc(hw.title)}</h4>
                  <span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-medium">${esc(formatClassBadge(hw.classes))}</span>
                </div>
                <div class="text-xs text-rose-600 font-medium mt-1">提交节点：${esc(hw.deadline)}</div>
              </div>
            </div>
            <div class="space-y-2">
              ${hw.tiers.map((t, idx) => {
                const key = `${hw.id}_${idx}`;
                const checked = !!state.checkedTasks[key];
                return `
                  <label class="flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition ${checked ? 'bg-emerald-50/60 border-emerald-200' : 'bg-slate-50/70 border-slate-200/80 hover:bg-white'}">
                    <input type="checkbox" data-hw-check="${key}" ${checked ? 'checked' : ''} class="mt-0.5 rounded border-slate-300 text-emerald-600" />
                    <div class="text-xs flex-1">
                      <div class="flex items-center justify-between gap-2">
                        <span class="font-bold ${checked ? 'line-through text-slate-400' : 'text-slate-800'}">${esc(t.level)}</span>
                        <span class="text-[11px] text-slate-400">${esc(t.time)}</span>
                      </div>
                      <p class="mt-1 leading-relaxed ${checked ? 'line-through text-slate-400' : 'text-slate-600'}">${esc(t.task)}</p>
                    </div>
                  </label>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col justify-between gap-3">
            <div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-violet-50 text-violet-700">${esc(r.category)}</span>
                <span class="text-[11px] text-slate-400">更新于 ${esc(r.updated)}</span>
              </div>
              <h4 class="text-sm font-bold text-slate-900 mt-2 leading-snug">${esc(r.title)}</h4>
              <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${esc(r.summary)}</p>
            </div>
            <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs">
              <span class="text-slate-400">${esc(formatClassBadge(r.classes))}</span>
              ${r.downloadUrl
                ? `<a href="${esc(r.downloadUrl)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-indigo-600 hover:underline">下载/打开资料 →</a>`
                : `<button data-res-preview="${r.id}" class="font-semibold text-indigo-600 hover:underline">查看说明 →</button>`
              }
            </div>
          </div>
        `;
      }

      function renderNoticeCard(n) {
        const tagStyle = n.tag === '重要提醒' ? 'bg-rose-50 text-rose-700' : 'bg-blue-50 text-blue-700';
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-4">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${tagStyle}">${esc(n.tag)}</span>
                <span class="text-xs font-medium text-indigo-600">${esc(formatClassBadge(n.classes))}</span>
              </div>
              <span class="text-xs text-slate-400">${esc(n.date)}</span>
            </div>
            <h4 class="text-sm font-bold text-slate-900 mt-2">${esc(n.title)}</h4>
            <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">${esc(n.content)}</p>
          </div>
        `;
      }

      function render() {
        const m = COURSE_PORTAL_DATA.meta;
        const schedules = COURSE_PORTAL_DATA.schedules.filter(s => matchClass(s.classes) && matchSearch(`${s.title} ${s.location} ${s.prepTip} ${s.type}`));
        const homeworks = COURSE_PORTAL_DATA.homework.filter(h => matchClass(h.classes) && matchSearch(`${h.title} ${h.tiers.map(t => t.task).join(' ')}`));
        const resources = COURSE_PORTAL_DATA.resources.filter(r => matchClass(r.classes) && matchSearch(`${r.title} ${r.category} ${r.summary}`));
        const notices = COURSE_PORTAL_DATA.notices.filter(n => matchClass(n.classes) && matchSearch(`${n.title} ${n.content} ${n.tag}`));

        const main = document.getElementById('appMain');

        if (state.tab === 'overview') {
          main.innerHTML = `
            <section class="rounded-2xl bg-gradient-to-r from-indigo-600 via-blue-600 to-teal-600 p-5 sm:p-6 text-white shadow-sm">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-white/15 text-xs font-medium mb-2">
                    <span>${esc(m.termWeek)}</span>
                    <span>·</span>
                    <span>${esc(m.textbook)}</span>
                  </div>
                  <h2 class="text-xl font-bold">${esc(m.courseName)} · 学习导航</h2>
                  <p class="text-xs sm:text-sm text-indigo-100 mt-1.5 max-w-2xl">${esc(m.welcomeNote)}</p>
                </div>
                <div class="grid grid-cols-2 gap-2.5 shrink-0 text-center">
                  <div class="px-4 py-2.5 rounded-xl bg-white/15">
                    <div class="text-lg font-bold">${schedules.length}</div>
                    <div class="text-[11px] text-indigo-100">近期课程/见习</div>
                  </div>
                  <div class="px-4 py-2.5 rounded-xl bg-white/15">
                    <div class="text-lg font-bold">${resources.length}</div>
                    <div class="text-[11px] text-indigo-100">公开学习资料</div>
                  </div>
                </div>
              </div>
            </section>

            <section class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div class="lg:col-span-7 space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-bold text-slate-900">本周课表与见习安排</h3>
                  <button data-jump="schedule" class="text-xs font-semibold text-indigo-600 hover:underline">查看全部 →</button>
                </div>
                ${schedules.length ? schedules.slice(0, 3).map(renderScheduleCard).join('') : '<div class="bg-white rounded-2xl border border-slate-200 p-6 text-center text-xs text-slate-400">暂无匹配课程安排</div>'}
              </div>

              <div class="lg:col-span-5 space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-bold text-slate-900">最新班级通知</h3>
                  <button data-jump="notices" class="text-xs font-semibold text-indigo-600 hover:underline">全部通知 →</button>
                </div>
                ${notices.length ? notices.slice(0, 3).map(renderNoticeCard).join('') : '<div class="bg-white rounded-2xl border border-slate-200 p-6 text-center text-xs text-slate-400">暂无匹配通知</div>'}
              </div>
            </section>

            <section class="space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-900">本周分层病案作业（可勾选个人完成进度）</h3>
                <button data-jump="homework" class="text-xs font-semibold text-indigo-600 hover:underline">全部作业 →</button>
              </div>
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                ${homeworks.length ? homeworks.map(renderHomeworkCard).join('') : '<div class="bg-white rounded-2xl border border-slate-200 p-6 text-center text-xs text-slate-400">暂无匹配作业</div>'}
              </div>
            </section>
          `;
        } else if (state.tab === 'schedule') {
          main.innerHTML = `
            <div class="space-y-3">
              <h2 class="text-base font-bold text-slate-900">课表与临床见习安排（共 ${schedules.length} 项）</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${schedules.length ? schedules.map(renderScheduleCard).join('') : '<div class="col-span-2 bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-400">当前筛选条件下暂无课程</div>'}
              </div>
            </div>
          `;
        } else if (state.tab === 'homework') {
          main.innerHTML = `
            <div class="space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h2 class="text-base font-bold text-slate-900">分层病案作业与自测清单</h2>
                <span class="text-xs text-slate-500">勾选状态仅保存在你自己的设备上，方便核对完成进度</span>
              </div>
              <div class="space-y-4">
                ${homeworks.length ? homeworks.map(renderHomeworkCard).join('') : '<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-400">当前筛选条件下暂无作业</div>'}
              </div>
            </div>
          `;
        } else if (state.tab === 'resources') {
          main.innerHTML = `
            <div class="space-y-3">
              <h2 class="text-base font-bold text-slate-900">公开课件、大纲与脱敏病案资料（共 ${resources.length} 份）</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                ${resources.length ? resources.map(renderResourceCard).join('') : '<div class="col-span-3 bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-400">当前筛选条件下暂无资料</div>'}
              </div>
            </div>
          `;
        } else if (state.tab === 'notices') {
          main.innerHTML = `
            <div class="space-y-3">
              <h2 class="text-base font-bold text-slate-900">班级通知与见习提醒（共 ${notices.length} 条）</h2>
              <div class="space-y-3">
                ${notices.length ? notices.map(renderNoticeCard).join('') : '<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-400">当前筛选条件下暂无通知</div>'}
              </div>
            </div>
          `;
        }

        // Bind dynamic events
        main.querySelectorAll('[data-jump]').forEach(el => {
          el.addEventListener('click', () => {
            state.tab = el.dataset.jump;
            updateTabChrome();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });

        main.querySelectorAll('[data-hw-check]').forEach(el => {
          el.addEventListener('change', () => {
            state.checkedTasks[el.dataset.hwCheck] = el.checked;
            saveChecks();
            render();
          });
        });

        main.querySelectorAll('[data-res-preview]').forEach(el => {
          el.addEventListener('click', () => {
            const res = COURSE_PORTAL_DATA.resources.find(x => x.id === el.dataset.resPreview);
            if (res) {
              openDetail(res.title, `
                <div class="flex flex-wrap gap-2">
                  <span class="px-2 py-0.5 rounded bg-violet-50 text-violet-700 font-semibold">${esc(res.category)}</span>
                  <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600">更新于 ${esc(res.updated)}</span>
                </div>
                <p class="p-3 rounded-xl bg-slate-50 border border-slate-200">${esc(res.summary)}</p>
                <p class="text-slate-500">提示：本页面当前为静态门户示例，老师在代码中填入学院网盘或超星学习通链接后，点击此处即可直接跳转下载。</p>
              `);
            }
          });
        });
      }

      function updateTabChrome() {
        document.querySelectorAll('#navTabs .tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === state.tab);
        });
      }

      document.querySelectorAll('#navTabs .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.tab = btn.dataset.tab;
          updateTabChrome();
          render();
        });
      });

      document.querySelectorAll('#classFilterBar .class-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedClass = btn.dataset.class;
          document.querySelectorAll('#classFilterBar .class-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render();
        });
      });

      document.getElementById('searchBox').addEventListener('input', (e) => {
        state.search = e.target.value;
        render();
      });

      document.getElementById('closeModalBtn').addEventListener('click', closeDetail);
      document.getElementById('modalOkBtn').addEventListener('click', closeDetail);
      document.getElementById('detailModal').addEventListener('click', (e) => {
        if (e.target.id === 'detailModal') closeDetail();
      });

      render();
    })();
  </script>
</body>
</html>
