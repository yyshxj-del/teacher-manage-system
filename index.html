      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)

      // Utility: Toast notification
      function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        const colors = type === 'error'
          ? 'bg-rose-600 text-white'
          : type === 'warning'
            ? 'bg-amber-600 text-white'
            : 'bg-slate-900 text-white';
        el.className = `${colors} px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium flex items-center gap-2 pointer-events-auto animate-view`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 2600);
      }

      // Utility: Copy to clipboard with fallback
      function copyText(text, label = '已复制到剪贴板') {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(label)).catch(() => fallbackCopy(text, label));
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(label);
        } catch (e) {
          showToast('复制失败，请手动选中复制', 'warning');
        }
        document.body.removeChild(ta);

      function downloadTextFile(filename, content) {
        try {
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(`已导出 ${filename}（导出后请抽查排版与公式）`);
        } catch (e) {
          showToast('导出失败，请使用复制功能', 'warning');
        }
      }

      // Main Render Router
      function render() {
        updateChrome();
        const main = document.getElementById('mainContent');
        if (state.searchQuery.trim()) {
          main.innerHTML = renderSearchResults();
          bindViewEvents();
          return;
        }
        const renderers = {
          dashboard: renderDashboard,
          courses: renderCourses,
          prep: renderPrep,
          classroom: renderClassroom,
          homework: renderHomework,
          classAffairs: renderClassAffairs,
          assets: renderAssets,
          students: renderStudents,
          review: renderReview,
          experts: renderExperts,
          settings: renderSettings,
          acceptance: renderAcceptance
        };
        main.innerHTML = (renderers[state.activeView] || renderDashboard)();
        bindViewEvents();
      }

      function navigate(view) {
        state.activeView = view;
        state.searchQuery = '';
        document.getElementById('globalSearchInput').value = '';
        saveState();
        closeMobileSidebar();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function openMobileSidebar() {
        document.getElementById('sidebar').classList.remove('-translate-x-full');
        document.getElementById('mobileOverlay').classList.remove('hidden');
      }

      function closeMobileSidebar() {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('mobileOverlay').classList.add('hidden');
      }

      // Bind dynamic events inside mainContent
      function bindViewEvents() {
        const main = document.getElementById('mainContent');

        // Generic goto links
        main.querySelectorAll('[data-goto]').forEach(el => {
          el.addEventListener('click', () => navigate(el.dataset.goto));
        });

        // Dashboard mode switch
        const modeMvpBtn = document.getElementById('modeMvpBtn');
        const modeFullBtn = document.getElementById('modeFullBtn');
        if (modeMvpBtn) modeMvpBtn.addEventListener('click', () => { state.dashboardMode = 'mvp4'; saveState(); render(); });
        if (modeFullBtn) modeFullBtn.addEventListener('click', () => { state.dashboardMode = 'full'; saveState(); render(); });

        // Launch workflow shortcut
        main.querySelectorAll('[data-launch-wf]').forEach(el => {
          el.addEventListener('click', () => {
            const wf = WORKFLOWS.find(w => w.id === el.dataset.launchWf);
            if (wf) {
              state.expertWorkspace.selectedWorkflow = wf.id;
              state.expertWorkspace.selectedExpert = wf.expert;
              navigate('experts');
            }
          });
        });

        // Toggle course status
        main.querySelectorAll('[data-toggle-course]').forEach(el => {
          el.addEventListener('click', () => {
            const c = state.courses.find(x => x.id === el.dataset.toggleCourse);
            if (c) {
              c.status = c.status === 'done' ? 'upcoming' : 'done';
              saveState();
              render();
              showToast(c.status === 'done' ? '已标记课程完成' : '已恢复为待授课');
            }
          });
        });

        // Prep from course
        main.querySelectorAll('[data-prep-from-course]').forEach(el => {
          el.addEventListener('click', () => {
            state.expertWorkspace.topic = el.dataset.prepFromCourse;
            state.expertWorkspace.selectedWorkflow = 'wf_lesson';
            state.expertWorkspace.selectedExpert = 'lesson_plan';
            navigate('experts');
          });
        });

        // Delete course
        main.querySelectorAll('[data-del-course]').forEach(el => {
          el.addEventListener('click', () => {
            state.courses = state.courses.filter(x => x.id !== el.dataset.delCourse);
            saveState();
            render();
            showToast('已删除该课程');
          });
        });

        // Toggle reminder
        main.querySelectorAll('[data-toggle-reminder]').forEach(el => {
          el.addEventListener('change', () => {
            const r = state.reminders.find(x => x.id === el.dataset.toggleReminder);
            if (r) {
              r.done = el.checked;
              saveState();
              render();
            }
          });
        });

        // Delete reminder
        main.querySelectorAll('[data-del-reminder]').forEach(el => {
          el.addEventListener('click', () => {
            state.reminders = state.reminders.filter(x => x.id !== el.dataset.delReminder);
            saveState();
            render();
          });
        });

        // Add Course modal
        const addCourseBtn = document.getElementById('addCourseBtn');
        if (addCourseBtn) {
          addCourseBtn.addEventListener('click', () => {
            openModal('添加今日课程', `
              <div class="space-y-3 text-xs">
                <div><label class="block font-semibold mb-1">上课时间</label><input id="mCourseTime" type="text" value="15:05 - 15:50" class="w-full px-3 py-2 rounded-xl border border-slate-200" /></div>
                <div><label class="block font-semibold mb-1">班级</label><input id="mCourseClass" type="text" value="${esc(state.config.classes[0] || '八年级(1)班')}" class="w-full px-3 py-2 rounded-xl border border-slate-200" /></div>

                <div><label class="block font-semibold mb-1">教室/地点</label><input id="mCourseRoom" type="text" value="致知楼 302" class="w-full px-3 py-2 rounded-xl border border-slate-200" /></div>

              state.studentRecords.unshift({
                id: 's_' + Date.now(),
                realName,
                anonId: `学生${idxLetter} (${cls})`,
                className: cls,
                tier: document.getElementById('mStuTier').value,
                weakPoint: document.getElementById('mStuWeak').value.trim() || '待补充',
                observation: document.getElementById('mStuObs').value.trim() || '常规表现记录',
                date: new Date().toISOString().slice(0, 10)
              });
              saveState(); closeModal(); render(); showToast('已保存学情记录');
            });
          });
        }

        main.querySelectorAll('[data-del-student]').forEach(el => {
          el.addEventListener('click', () => {
            state.studentRecords = state.studentRecords.filter(x => x.id !== el.dataset.delStudent);
            saveState(); render(); showToast('已删除学情记录');
          });
        });

        // Weekly Review save
        const saveReviewBtn = document.getElementById('saveReviewBtn');
        if (saveReviewBtn) {
          saveReviewBtn.addEventListener('click', () => {
            const weekLabel = document.getElementById('reviewWeekInput').value.trim() || `复盘记录 ${new Date().toISOString().slice(0, 10)}`;
            const problems = document.getElementById('reviewProblemsInput').value.trim();
            const highlights = document.getElementById('reviewHighlightsInput').value.trim();
            const nextPlan = document.getElementById('reviewNextPlanInput').value.trim();
            if (!problems && !highlights && !nextPlan) return showToast('请至少填写一项复盘内容', 'warning');
            state.weeklyReviews.unshift({
              id: 'w_' + Date.now(),
              weekLabel,
              date: new Date().toISOString().slice(0, 10),
              problems: problems || '暂无突出问题',
              highlights: highlights || '保持稳定教学节奏',
              nextPlan: nextPlan || '按计划推进下周课时'
            });
            saveState(); render(); showToast('已保存至每周复盘历史档案');
          });
        }

        // AI Experts & Workflows events
        main.querySelectorAll('[data-select-expert]').forEach(el => {
          el.addEventListener('click', () => {
            const exp = AI_EXPERTS.find(e => e.id === el.dataset.selectExpert);
            if (exp) {
              state.expertWorkspace.selectedExpert = exp.id;
              state.expertWorkspace.selectedWorkflow = exp.workflow;
              saveState(); render();
            }
          });
        });

        const wfSelect = document.getElementById('wfSelect');
        if (wfSelect) {
          wfSelect.addEventListener('change', () => {
            state.expertWorkspace.selectedWorkflow = wfSelect.value;
            const wf = WORKFLOWS.find(x => x.id === wfSelect.value);
            if (wf) state.expertWorkspace.selectedExpert = wf.expert;
            saveState(); render();
          });
        }

        const wfTopic = document.getElementById('wfTopicInput');
        const wfChapter = document.getElementById('wfChapterInput');
        const wfNotes = document.getElementById('wfNotesInput');
        if (wfTopic) wfTopic.addEventListener('input', () => { state.expertWorkspace.topic = wfTopic.value; saveState(); });
        if (wfChapter) wfChapter.addEventListener('input', () => { state.expertWorkspace.chapter = wfChapter.value; saveState(); });
        if (wfNotes) wfNotes.addEventListener('input', () => { state.expertWorkspace.extraNotes = wfNotes.value; saveState(); });

        main.querySelectorAll('[data-toggle-wf-asset]').forEach(el => {
          el.addEventListener('change', () => {
            const id = el.dataset.toggleWfAsset;
            if (el.checked) {
              if (!state.expertWorkspace.attachedAssetIds.includes(id)) state.expertWorkspace.attachedAssetIds.push(id);
            } else {
              state.expertWorkspace.attachedAssetIds = state.expertWorkspace.attachedAssetIds.filter(x => x !== id);
            }
            saveState(); render();
          });
        });

        const runExpertBtn = document.getElementById('runExpertBtn');
        if (runExpertBtn) {
          runExpertBtn.addEventListener('click', () => {
            state.expertWorkspace.generatedDraft = buildExpertDraft();
            state.expertWorkspace.draftReviewed = false;
            saveState(); render();
            showToast('已生成初稿！请核对教材课标后点击“标记人工已审”');
          });
        }

        const draftOutputArea = document.getElementById('draftOutputArea');
        if (draftOutputArea) {
          draftOutputArea.addEventListener('input', () => {
            state.expertWorkspace.generatedDraft = draftOutputArea.value;
            saveState();
          });
        }

        const confirmReviewBtn = document.getElementById('confirmReviewBtn');
        if (confirmReviewBtn) {
          confirmReviewBtn.addEventListener('click', () => {
            if (!state.expertWorkspace.generatedDraft.trim()) return showToast('请先生成初稿', 'warning');
            state.expertWorkspace.draftReviewed = !state.expertWorkspace.draftReviewed;
            saveState(); render();
            showToast(state.expertWorkspace.draftReviewed ? '已确认人工终审，可安全归档或导出' : '已切换为待审核状态');
          });
        }

        const copyDraftBtn = document.getElementById('copyDraftBtn');
        if (copyDraftBtn) {
          copyDraftBtn.addEventListener('click', () => {
            if (!state.expertWorkspace.generatedDraft.trim()) return showToast('当前没有可复制的内容', 'warning');
            copyText(state.expertWorkspace.generatedDraft, '已复制产出内容');
          });
        }

        const exportDraftBtn = document.getElementById('exportDraftBtn');
        if (exportDraftBtn) {
          exportDraftBtn.addEventListener('click', () => {
            if (!state.expertWorkspace.generatedDraft.trim()) return showToast('请先生成初稿再导出', 'warning');
            const name = `${state.expertWorkspace.topic || '教学产出'}_${new Date().toISOString().slice(0, 10)}.md`;
            downloadTextFile(name, state.expertWorkspace.generatedDraft);
          });
        }

        const archiveDraftBtn = document.getElementById('archiveDraftBtn');
        if (archiveDraftBtn) {
          archiveDraftBtn.addEventListener('click', () => {
            if (!state.expertWorkspace.generatedDraft.trim()) return showToast('请先生成初稿再归档', 'warning');
            const wf = WORKFLOWS.find(x => x.id === state.expertWorkspace.selectedWorkflow);
            const today = new Date().toISOString().slice(0, 10);
            state.assets.unshift({
              id: 'a_' + Date.now(),
              zone: 'output',
              title: `${state.expertWorkspace.topic || '教学方案'}_${wf ? wf.name : 'AI产出'}_${today}.md`,
              date: today.slice(0, 7),
              className: state.config.classes[0] || '通用',
              docType: state.expertWorkspace.selectedWorkflow === 'wf_ppt' ? '课件' : state.expertWorkspace.selectedWorkflow === 'wf_homework' ? '习题与题库' : '教案',
              sizeMB: 1,
              summary: state.expertWorkspace.generatedDraft
            });
            saveState(); updateChrome();
            showToast('已一键归档至「资产库 · 产出文件区」');
          });
        }

        const shareColleagueBtn = document.getElementById('shareColleagueBtn');
        if (shareColleagueBtn) {
          shareColleagueBtn.addEventListener('click', () => {
            if (!state.expertWorkspace.generatedDraft.trim()) return showToast('请先生成产出内容再流转', 'warning');
            const packText = `【WorkBuddy 备课组流转包】\n项目：${state.config.projectName}\n课题：${state.expertWorkspace.topic}\n教材版本：${state.config.textbookVersion}\n审核状态：${state.expertWorkspace.draftReviewed ? '已人工终审' : '初稿待共同审定'}\n说明：已自动禁用个人授权连接器，接收方无需重沟通背景即可接续修改。\n\n${state.expertWorkspace.generatedDraft}`;
            openModal('流转产物给备课组同事', `
              <div class="space-y-3 text-xs">
                <div class="p-3 rounded-xl bg-indigo-50 text-indigo-900">
                  流转将打包：<strong>任务产物 + 项目指令上下文 + 审核状态</strong>。已自动遵循安全边界（个人授权连接器禁用，学生信息已脱敏）。
                </div>
                <textarea id="sharePackText" rows="10" readonly class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 font-mono text-[11px]">${esc(packText)}</textarea>
              </div>
            `, `<button id="mCancelBtn" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-xs">关闭</button><button id="mCopyShareBtn" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">复制流转包</button>`);
            document.getElementById('mCancelBtn').addEventListener('click', closeModal);
            document.getElementById('mCopyShareBtn').addEventListener('click', () => {
              copyText(packText, '已复制备课组流转包，可直接发给同事');
              closeModal();
            });
          });
        }

        // Settings save & prompt generator
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        if (saveConfigBtn) {
          saveConfigBtn.addEventListener('click', () => {
            state.config.projectName = document.getElementById('cfgProjectName').value.trim() || state.config.projectName;
            state.config.teacherRole = document.getElementById('cfgTeacherRole').value.trim();
            state.config.subject = document.getElementById('cfgSubject').value.trim();
            const clsRaw = document.getElementById('cfgClasses').value.trim();
            state.config.classes = clsRaw ? clsRaw.split(/[，,、]/).map(s => s.trim()).filter(Boolean) : ['默认班级'];
            state.config.textbookVersion = document.getElementById('cfgTextbook').value.trim();
            state.config.dailyTasks = document.getElementById('cfgDailyTasks').value.trim();
            state.config.commonResources = document.getElementById('cfgResources').value.trim();
            state.config.reminderStyle = document.getElementById('cfgReminderStyle').value.trim();
            state.config.reviewHabit = document.getElementById('cfgReviewHabit').value.trim();
            state.config.globalInstructions = document.getElementById('cfgGlobalInstructions').value.trim();
            saveState(); render(); showToast('项目配置与全局指令已保存生效');
          });
        }

        const generatePromptBtn = document.getElementById('generatePromptBtn');
        if (generatePromptBtn) {
          generatePromptBtn.addEventListener('click', () => {
            const c = state.config;
            const promptText = `请帮我搭建一个教师个人工作台首页，适用于${c.teacherRole}日常使用（任教${c.classes.join('、')}，教材版本：${c.textbookVersion}）。页面请包含：今日课程、备课中心、作业反馈、教学资源、班级事务、每周复盘。首页优先展示今天课表、待办提醒、待批改作业数量和常用资料入口。全局指令要求：${c.globalInstructions}。整体风格简洁、清楚，适合每天打开直接使用。`;
            openModal('可直接复制给 WorkBuddy 的搭建指令', `
              <div class="space-y-3 text-xs">
                <p class="text-slate-600">已根据你填写的 6 项需求模板与全局指令，自动生成文章推荐的标准搭建提示词：</p>
                <textarea rows="7" readonly class="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-200 leading-relaxed text-slate-800">${esc(promptText)}</textarea>
              </div>
            `, `<button id="mCancelBtn" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-xs">关闭</button><button id="mCopyPromptBtn" class="px-4 py-1.5 rounded-lg bg-violet-600 text-white text-xs font-semibold">复制指令</button>`);
            document.getElementById('mCancelBtn').addEventListener('click', closeModal);
            document.getElementById('mCopyPromptBtn').addEventListener('click', () => {
              copyText(promptText, '已复制 WorkBuddy 搭建指令');
              closeModal();
            });
          });
        }

        const resetDemoDataBtn = document.getElementById('resetDemoDataBtn');
        if (resetDemoDataBtn) {
          resetDemoDataBtn.addEventListener('click', () => {
            openModal('恢复默认演示数据', `<p class="text-xs text-slate-600">确定要将所有课程、备课、资产库和项目配置恢复为初始演示数据吗？此操作无法撤销。</p>`,
              `<button id="mCancelBtn" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-xs">取消</button><button id="mConfirmResetBtn" class="px-4 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold">确认重置</button>`);
            document.getElementById('mCancelBtn').addEventListener('click', closeModal);
            document.getElementById('mConfirmResetBtn').addEventListener('click', () => {
              state = getDefaultState();
              saveState(); closeModal(); render(); showToast('已恢复默认演示数据');
            });
          });
        }

        // Scheduled tasks toggle & add
        main.querySelectorAll('[data-toggle-schedule]').forEach(el => {
          el.addEventListener('click', () => {
            const st = state.scheduledTasks.find(x => x.id === el.dataset.toggleSchedule);
            if (st) {
              st.enabled = !st.enabled;
              saveState(); render(); showToast(st.enabled ? '已启用该定时任务' : '已暂停该定时任务');
            }
          });
        });

        const addScheduleBtn = document.getElementById('addScheduleBtn');
        if (addScheduleBtn) {
          addScheduleBtn.addEventListener('click', () => {
            openModal('新建定时任务', `
              <div class="space-y-3 text-xs">
                <div><label class="block font-semibold mb-1">任务名称</label><input id="mStTitle" type="text" placeholder="例如：每周三4个班临床见习进度与病历规范检查" class="w-full px-3 py-2 rounded-xl border border-slate-200" /></div>
                <div><label class="block font-semibold mb-1">触发周期</label><input id="mStTime" type="text" placeholder="例如：每周三 18:00" class="w-full px-3 py-2 rounded-xl border border-slate-200" /></div>
                <div><label class="block font-semibold mb-1">自动执行提示词</label><textarea id="mStPrompt" rows="2" class="w-full p-2.5 rounded-xl border border-slate-200"></textarea></div>
              </div>
            `, `<button id="mCancelBtn" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-xs">取消</button><button id="mSaveStBtn" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">保存任务</button>`);
            document.getElementById('mCancelBtn').addEventListener('click', closeModal);
            document.getElementById('mSaveStBtn').addEventListener('click', () => {
              const title = document.getElementById('mStTitle').value.trim();
              if (!title) return showToast('请填写任务名称', 'warning');
              state.scheduledTasks.push({
                id: 'st_' + Date.now(),
                title,
                schedule: document.getElementById('mStTime').value.trim() || '每周固定时间',
                prompt: document.getElementById('mStPrompt').value.trim() || '提醒执行周期性教学任务',
                enabled: true
              });
              saveState(); closeModal(); render(); showToast('已新建定时任务');
            });
          });
        }

        // Acceptance checklist toggle
        main.querySelectorAll('[data-toggle-acc]').forEach(el => {
          el.addEventListener('change', () => {
            const item = state.acceptanceChecklist.find(x => x.id === el.dataset.toggleAcc);
            if (item) {
              item.checked = el.checked;
              saveState(); render();
            }
          });
        });
      }

      // Bind static chrome listeners once
      document.querySelectorAll('#sidebarNav .nav-item').forEach(btn => {
        btn.addEventListener('click', () => navigate(btn.dataset.view));
      });
      document.getElementById('sidebarProjectBtn').addEventListener('click', () => navigate('settings'));
      document.getElementById('openSidebarBtn').addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
      document.getElementById('mobileOverlay').addEventListener('click', closeMobileSidebar);
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
      document.getElementById('modalBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modalBackdrop') closeModal();
      });

      document.getElementById('togglePrivacyBtn').addEventListener('click', () => {
        state.privacyAnonymized = !state.privacyAnonymized;
        saveState();
        render();
        showToast(state.privacyAnonymized ? '已开启隐私脱敏，学生姓名将显示为匿名编号' : '已关闭隐私脱敏（仅建议本地自查）', state.privacyAnonymized ? 'success' : 'warning');
      });

      document.getElementById('quickAiPrepBtn').addEventListener('click', () => navigate('experts'));

      const searchInput = document.getElementById('globalSearchInput');
      searchInput.addEventListener('input', () => {
        state.searchQuery = searchInput.value;
        render();
      });
      document.getElementById('clearSearchBtn').addEventListener('click', () => {
        state.searchQuery = '';
        searchInput.value = '';
        render();
      });

      // Initial render
      render();
    })();
  </script>
</body>
</html>
